[project]
name = "etsy-performance-employee-backend"
version = "0.1.0"
description = "Local API for the Etsy performance-costume digital employee"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "PyYAML>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
